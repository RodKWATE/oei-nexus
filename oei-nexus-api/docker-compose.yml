version: "3.9"

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://oei:oei_password@db:5432/oei_nexus
  DATABASE_URL_SYNC: postgresql://oei:oei_password@db:5432/oei_nexus
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENVIRONMENT: ${ENVIRONMENT:-development}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oei
      POSTGRES_PASSWORD: oei_password
      POSTGRES_DB: oei_nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oei -d oei_nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *api-env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        python scripts/seed.py &&
        gunicorn app.main:app -c gunicorn.conf.py
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *api-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.workers.tasks worker
      --loglevel=${LOG_LEVEL:-info}
      --concurrency=2
      --without-gossip
      --without-mingle
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.tasks", "inspect", "ping"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
