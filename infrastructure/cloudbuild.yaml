# =============================================================================
# OEI Nexus — Cloud Build CI/CD pipeline
#
# Triggered automatically on every push to main branch.
# Assumes infrastructure was created by provision.sh (Cloud SQL, Redis, VPC,
# Artifact Registry, Service Account, Secrets).
#
# Variables injected by the Cloud Build trigger (set them there):
#   _REGION          e.g. us-central1
#   _PROJECT_ID      your GCP project ID
#   _SQL_INSTANCE    PROJECT:REGION:oei-postgres
#   _VPC_CONNECTOR   projects/PROJECT/locations/REGION/connectors/oei-connector
#   _SA_EMAIL        oei-cloudrun@PROJECT.iam.gserviceaccount.com
# =============================================================================

substitutions:
  _REGION: us-central1
  _AR_REPO: oei-nexus
  _API_SERVICE: oei-api
  _FRONTEND_SERVICE: oei-frontend
  _WORKER_SERVICE: oei-worker

steps:
  # ── PHASE 1: Build images (all 3 in parallel) ────────────────────────────

  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - oei-nexus-api/Dockerfile.cloudrun
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:latest
      - oei-nexus-api

  - id: build-worker
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - oei-nexus-api/Dockerfile.worker
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/worker:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/worker:latest
      - oei-nexus-api

  - id: build-frontend
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:latest
      - oei-nexus-react

  # ── PHASE 2: Push images ─────────────────────────────────────────────────

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: [push, "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api"]
    waitFor: [build-api]

  - id: push-worker
    name: gcr.io/cloud-builders/docker
    args: [push, "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/worker"]
    waitFor: [build-worker]

  - id: push-frontend
    name: gcr.io/cloud-builders/docker
    args: [push, "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend"]
    waitFor: [build-frontend]

  # ── PHASE 3: Database migrations ─────────────────────────────────────────
  # Uses Cloud Run Job created by provision.sh — updates image then executes.

  - id: update-migrate-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - oei-migrate
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$COMMIT_SHA
      - --region=${_REGION}
    waitFor: [push-api]

  - id: run-migrations
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - oei-migrate
      - --region=${_REGION}
      - --wait
    waitFor: [update-migrate-job]

  # ── PHASE 4: Deploy services (API and Worker after migrations, Frontend independent) ──

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --quiet
    waitFor: [run-migrations]

  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WORKER_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/worker:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --quiet
    waitFor: [run-migrations]

  - id: deploy-frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONTEND_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --quiet
    waitFor: [push-frontend]

  # ── PHASE 5: Smoke test ──────────────────────────────────────────────────

  - id: smoke-test
    name: gcr.io/cloud-builders/curl
    entrypoint: sh
    args:
      - -c
      - |
          API_URL=$(gcloud run services describe ${_API_SERVICE} \
            --region=${_REGION} --format="value(status.url)")
          echo "Testing $API_URL/health ..."
          curl -sf "$API_URL/health" | grep '"status"'
          echo "Smoke test passed."
    waitFor: [deploy-api]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/worker:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s   # 30 min max
