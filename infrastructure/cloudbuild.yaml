# Cloud Build CI/CD pipeline
# Triggered on push to main branch
#
# Substitutions (set in Cloud Build trigger or cloudbuild.yaml):
#   _PROJECT_ID   — GCP project ID
#   _REGION       — e.g. us-central1
#   _INSTANCE     — Cloud SQL instance connection name
#   _VPC_CONNECTOR — e.g. projects/PROJECT/locations/REGION/connectors/oei-connector

substitutions:
  _REGION: us-central1
  _AR_REPO: oei-nexus
  _API_SERVICE: oei-api
  _FRONTEND_SERVICE: oei-frontend
  _WORKER_SERVICE: oei-worker

steps:
  # ── 1. Build API image ─────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-api
    args:
      - build
      - -f
      - oei-nexus-api/Dockerfile.cloudrun
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:latest
      - oei-nexus-api

  # ── 2. Build Worker image ──────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-worker
    args:
      - build
      - -f
      - oei-nexus-api/Dockerfile.worker
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/worker:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/worker:latest
      - oei-nexus-api

  # ── 3. Build Frontend image ────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:latest
      - oei-nexus-react

  # ── 4. Push all images ────────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-api
    args: [push, "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api"]
    waitFor: [build-api]

  - name: gcr.io/cloud-builders/docker
    id: push-worker
    args: [push, "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/worker"]
    waitFor: [build-worker]

  - name: gcr.io/cloud-builders/docker
    id: push-frontend
    args: [push, "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend"]
    waitFor: [build-frontend]

  # ── 5. Run Alembic migrations via Cloud Run Job ───────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: migrate
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - oei-migrate
      - --region=${_REGION}
      - --wait
    waitFor: [push-api]

  # ── 6. Deploy API to Cloud Run ────────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-api
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
    waitFor: [migrate]

  # ── 7. Deploy Worker to Cloud Run ────────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-worker
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WORKER_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/worker:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
    waitFor: [migrate]

  # ── 8. Deploy Frontend to Cloud Run ──────────────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-frontend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_FRONTEND_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
    waitFor: [push-frontend]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/api:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/worker:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/frontend:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
